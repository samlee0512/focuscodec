[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focuscodec"
version = "0.1.0"
description = "AI-guided region-of-interest video coding for low-bandwidth video calls"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyyaml", "matplotlib"]

[project.optional-dependencies]
seg = ["torch", "torchvision", "opencv-python", "pycocotools"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
